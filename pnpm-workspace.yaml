packages:
  - 'packages/*/*'

shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true
# Ensure the postinstall script of the lefthook package is executed and hooks are installed
sideEffectsCache: false
# Require a package to be published at least 12 days (17280 minutes) before it can be installed
# minimumReleaseAge: 17280
minimumReleaseAgeExclude:
  - '@kong/*'
  - '@kong-ui/*'
  - '@kong-ui-public/*'
# When set to no-downgrade, pnpm will fail if a package's trust level has decreased compared to previous releases
trustPolicy: no-downgrade
# Ignore policy if published at least 12 days (17280 minutes)
trustPolicyIgnoreAfter: 17280

auditConfig:
  ignoreGhsas:
    - 'GHSA-p9ff-h696-f583'
    - 'GHSA-5xrq-8626-4rwp'
    - 'GHSA-gv7w-rqvm-qjhr'
    - 'GHSA-fx2h-pf6j-xcff'
    - 'GHSA-67hx-6x53-jw92'

overrides:
  axios@>=1.0.0 <1.18.0: ^1.18.0
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  browserslist@<=4.28.6: ^4.28.7
  cookie@<0.7.0: ^0.7.2
  dompurify@<=3.4.12: ^3.4.13
  form-data@>=3.0.0 <3.0.5: ^3.0.5
  immutable@<4.3.9: ^4.3.9
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  minimatch@>=9.0.0 <9.0.7: ^9.0.7
  pacote@>=11.2.7 <21.5.1: ^21.5.1
  prismjs@<1.30.0: ^1.30.0
  tmp@<0.2.6: ^0.2.7
  uuid@<11.1.1: ^11.1.1

allowBuilds:
  '@evilmartians/lefthook': true
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  cypress: true
  es5-ext: true
  esbuild: true
  nx: false
  swagger-ui: true
  tree-sitter: true
  tree-sitter-json: true
  tree-sitter-yaml: true
  vue-demi: true
