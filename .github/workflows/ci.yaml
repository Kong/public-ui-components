name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build And Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read
      pull-requests: write
    outputs:
      filter: ${{steps.changed_packages.outputs.filter}}
      unitTestMatrix: ${{steps.changed_packages.outputs.unitTestMatrix}}
      componentTestMatrix: ${{steps.changed_packages.outputs.componentTestMatrix}}

    steps:
      # if previous run did create comment with the reference to PR preview package
      # this comment is removed in this step
      - name: Remove preview consumption comment
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        uses: Kong/sticky-pull-request-comment@ae583cebedbfd32256b349cce8ddf5772e77636e # v3.0.4
        with:
          header: pr_preview_consumption
          delete: true
          GITHUB_TOKEN: ${{ github.token }}

      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # When running on push, we compare the state of PR and main branches. If they are
      # identical - we will skip test execution as those were already executed on same code in PR branch
      # see 'run-test' step and variable bellow
      - name: Check if PR Up to Date
        id: 'up-to-date'
        if: ${{ github.event_name == 'push' }}
        uses: Kong/public-shared-actions/pr-previews/up-to-date@8d98bc15a5143332a36f206e6699296e6cc2adac

      - name: Setup PNPM with Dependencies
        uses: ./.github/actions/setup-pnpm-with-dependencies/
        with:
          force-install: true

      # see the comment for `up-to-date` action
      - name: Need to run tests
        id: 'run-tests'
        run: |
          echo "run-tests=${{ (github.event_name == 'push' && steps.up-to-date.outputs.status == 'true') && 'false' || 'true' }}"
          echo "run-tests=${{ (github.event_name == 'push' && steps.up-to-date.outputs.status == 'true') && 'false' || 'true' }}" >> $GITHUB_OUTPUT

      # If we detect changes in any of the config files (e.g. pnpm-workspace.yaml, shared cypress configs, etc.), we need to build every package
      # See 'changed_packages' below
      - name: Check for config file changes
        id: config-files-changed
        uses: Kong/changed-files@cd69b79ca4e2a1198064c5e6564cce68920df311
        with:
          files: |
            ./vite.config.shared.ts
            ./cypress.config.ts
            ./cypress/**
            ./package.json
            ./pnpm-workspace.yaml
            ./eslintrc.cjs
            ./.stylelintrc.js
            ./.github/**

      - name: Verify no packages are in the wrong scope and have the correct publishConfig.access
        run: |
          # Verify no packages are in the wrong scope and have the correct publishConfig.access

          # Utilize the lerna command to determine the packages that were added/updated
          # we execute lerna changed to grab all the packages changed
          lernaCommand="changed"

          # if config-files-changed detects a change in any of the watched config files - we will grab all the packages
          if [[ "${{ steps.config-files-changed.outputs.any_modified }}" == "true" ]]; then
            lernaCommand="ls"
          fi

          echo "lernaCommand: ${lernaCommand}"

          lernaOutput=$(pnpm --silent lerna ${lernaCommand} --l --json 2>lerna_error.txt| jq -r '.[].location' || true)
          if [[ $(cat lerna_error.txt|grep "ERR!") ]]; then
            echo "Error executing lerna command:"
            cat lerna_error.txt
            exit -1
          fi

          # Verify no packages exist from the `@kong-ui` scope; if yes, then exit with error
          for packageLocation in ${lernaOutput}
          do
            packageName=$(jq -r '.name' "$packageLocation"/package.json)
            publishConfigAccess=$(jq -r '.publishConfig.access' "$packageLocation"/package.json)

            # Check if package.json name contains the wrong scope
            if [[ "$packageName" == *"@kong-ui/"* ]]; then
              echo "::error::The '""$packageName""' package.json contains an incorrect npm scope '""@kong-ui""'. This repository requires packages to have the npm scope of '""@kong-ui-public""'."
              exit 1
            fi

            # Check if the package.json publishConfig.access is incorrect for this repo
            if [[ "$publishConfigAccess" != "public" ]]; then
              echo "::error::The '""$packageName""' package.json contains the publishConfig.access of '""$publishConfigAccess""'. This repository requires packages to have a publishConfig.access of '""public""'."
              exit 1
            fi
          done

      - name: Getting changed packages
        id: changed_packages
        run: |
          # we execute lerna changed to grab all the packages changed
          lernaCommand="changed"

          # if config-files-changed detects a change in any of the watched config files - we will grab all the packages
          if [[ "${{ steps.config-files-changed.outputs.any_modified }}" == "true" ]]; then
            lernaCommand="ls"
          fi

          echo "lernaCommand: ${lernaCommand}"

          changedPkgs=()
          unitTestPkgs=()
          componentTestPkgs=()

          lernaOutput=$(pnpm --silent lerna ${lernaCommand} --l --json 2>lerna_error.txt| jq -r '.[].location' || true)
          if [[ $(cat lerna_error.txt|grep "ERR!") ]]; then
            echo "Error executing lerna command:"
            cat lerna_error.txt
            exit -1
          fi

          # get the list of changed packages, grab the location
          for pkgFolder in ${lernaOutput}
          do
            # remove current folder from the location path
            pkgFolder="${pkgFolder/$(pwd)\//}"

            changedPkgs+=("${pkgFolder}")

            # if there is cypress tests in the package, add package path to cypress spec
            findRes=$(find "${pkgFolder}" -name "*.cy.ts" || true)
            if [[ -n "${findRes}" ]]; then
                componentTestPkgs+=("${pkgFolder}")
            fi

            # we will keep the list of packages that do require unit tests based on the fact that we
            # detecting UT files
            findRes=$(find "${pkgFolder}" -name "*.spec.ts" || true)
            if [[ -n "${findRes}" ]]; then
                unitTestPkgs+=("${pkgFolder}")
            fi
          done

          if [[ "${{steps.run-tests.outputs.run-tests}}" != "true" ]]; then
            unitTestPkgs=()
            componentTestPkgs=()
          fi

          # pnpm 12 matches `{<dir>}` as a glob (see `legacyDirFiltering`), so the `{(<path>|<path>)}`
          # group selector no longer matches anything. Pass one `--filter` per package instead.
          # Paths are given as `./<path>` so they are read as directories rather than package names.
          # Usage: selectors <prefix> <suffix> <path>...
          # Prints nothing for an empty list, which the `if` conditions below rely on.
          selectors() {
            local prefix="$1" suffix="$2" out="" path
            shift 2
            for path in "$@"; do
              out="${out} --filter ${prefix}${path}${suffix}"
            done
            echo "${out# }"
          }

          # JSON array of the given strings, or nothing at all when there are none
          jsonArray() {
            if [[ $# -gt 0 ]]; then
              jq -cn '$ARGS.positional' --args "$@"
            fi
          }

          filter=$(selectors './' '' "${changedPkgs[@]}")
          # `...{<path>}...` selects the package together with its dependencies and dependents
          buildFilter=$(selectors '...{./' '}...' "${changedPkgs[@]}")
          unitTestFilter=$(selectors './' '' "${unitTestPkgs[@]}")

          # matrices in the format json.parse understands; unit test paths are relative to `packages/`
          unitTestMatrix=$(jsonArray "${unitTestPkgs[@]#packages/}")
          componentTestMatrix=$(jsonArray "${componentTestPkgs[@]}")

          echo "filter=${filter}"
          echo "buildFilter=${buildFilter}"
          echo "unitTestFilter=${unitTestFilter}"
          echo "unitTestMatrix=${unitTestMatrix}"
          echo "componentTestMatrix=${componentTestMatrix}"

          # this is to pass to `pnpm` to run a command on all changed packages
          echo "filter=${filter}" >> $GITHUB_OUTPUT

          # same as above, but the packages are selected together with their dependencies and dependents
          echo "buildFilter=${buildFilter}" >> $GITHUB_OUTPUT

          # this is changed packages that do have unit tests - to be passed to `pnpm`
          echo "unitTestFilter=${unitTestFilter}" >> $GITHUB_OUTPUT

          # this is unit tests in the format json.parse understands
          echo "unitTestMatrix=${unitTestMatrix}" >> $GITHUB_OUTPUT

          # this is component tests in the format json.parse understands
          echo "componentTestMatrix=${componentTestMatrix}" >> $GITHUB_OUTPUT

      - name: Stylelint Packages
        if: ${{ steps.changed_packages.outputs.filter != '' }}
        env:
          PNPM_FILTER: ${{ steps.changed_packages.outputs.filter }}
        run: pnpm --fail-if-no-match --parallel --stream $PNPM_FILTER run stylelint

      - name: Lint Packages
        if: ${{ steps.changed_packages.outputs.filter != '' }}
        env:
          PNPM_FILTER: ${{ steps.changed_packages.outputs.filter }}
        run: pnpm --fail-if-no-match --parallel --stream $PNPM_FILTER run lint

      - name: Build Packages
        if: ${{ steps.changed_packages.outputs.filter != '' }}
        # The `...{<path>}...` syntax tells pnpm to include dependent and dependency packages
        env:
          PNPM_FILTER: ${{ steps.changed_packages.outputs.buildFilter }}
        run: pnpm --fail-if-no-match --stream $PNPM_FILTER run build

      - name: Check dist bundle size against max-limit
        if: ${{ steps.changed_packages.outputs.filter != '' }}
        uses: Kong/github-action-dist-size-checker@4a3422fbaa0ab9fced4959078dbb69d157db873e # main

      - name: Publish Previews
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && steps.changed_packages.outputs.filter != '' && (github.actor != 'renovate[bot]' || contains(github.event.pull_request.labels.*.name, 'create preview package')) }}

        run: |
          git config user.email "konnectx-engineers+kongponents-bot@konghq.com"
          git config user.name "Kong UI Bot"

          preid="pr.${{ github.event.pull_request.number }}.$(git rev-parse --short ${{ github.event.pull_request.head.sha }})"
          tag="pr-${{ github.event.pull_request.number }}"
          echo "preid=${preid}"

          git checkout "${{ github.head_ref }}"

          versions=$(pnpm --silent lerna version prerelease --preid ${preid} --allow-branch ${{ github.head_ref }} --conventional-prerelease --yes --amend --json --no-git-tag-version 2>lerna_error.txt || true)
          if [[ $(cat lerna_error.txt|grep "ERR!") ]]; then
            echo "Error executing lerna command:"
            cat lerna_error.txt
            exit -1
          fi

          if [[ "${versions}" == "" ]]; then
            echo "no packages to version"
            exit 0
          fi

          filterStr=$(echo ${versions} | jq -r 'try .[]|"--filter "+.name' | tr '\n' ' ')

          rm -f pnpm-publish-summary.json

          if [[ "${filterStr}" != "" ]]; then
            pnpm $filterStr publish --no-git-checks --access public --report-summary --tag "${tag}"
          fi

          if [[ ! -f pnpm-publish-summary.json ]] || [[ "$(jq '.publishedPackages | length' pnpm-publish-summary.json)" == "0" ]]; then
            echo "There are no new packages that should be published"
            exit 0
          fi

          # pnpm 11's native publish flow no longer prints npm CLI's "+ name@version"
          # lines to stdout, so the published package list is read from the
          # --report-summary JSON file instead.
          npm_instructions=$(jq -r --arg tag "${tag}" '.publishedPackages[]?|.name+"@"+$tag' pnpm-publish-summary.json)

          if [[ -z "${npm_instructions}" ]]; then
            echo "Error creating preview instructions"
            exit -1
          fi

          echo "npm_instructions<<EOF" >> $GITHUB_ENV
          echo -e "$npm_instructions" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Provide preview link info
        if: ${{ env.npm_instructions != '' && github.event.pull_request.head.repo.fork != true }}
        uses: Kong/sticky-pull-request-comment@ae583cebedbfd32256b349cce8ddf5772e77636e # v3.0.4
        with:
          header: pr_preview_consumption
          message: |
             ## ***Preview*** components from this PR in consuming application
             In consuming application project install preview versions of shared packages generated by this PR:
             ```
             ${{env.npm_instructions}}
             ```
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run Unit Tests
        if: ${{ steps.changed_packages.outputs.unitTestFilter != '' }}
        env:
          PNPM_FILTER: ${{ steps.changed_packages.outputs.unitTestFilter }}
        run: pnpm --fail-if-no-match --parallel --stream $PNPM_FILTER run test:unit

      - name: Save Build Artifacts
        if: ${{ steps.changed_packages.outputs.filter != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-dist-artifacts
          path: packages/*/*/dist

  component-tests:
    name: Component tests
    needs: [build]
    runs-on: ubuntu-latest
    if: ${{ needs.build.outputs.componentTestMatrix != ''}}
    timeout-minutes: 20
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJSON(needs.build.outputs.componentTestMatrix) }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM with Dependencies
        uses: ./.github/actions/setup-pnpm-with-dependencies/

      - name: Prepare Cypress
        run: pnpm cypress install

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist-artifacts
          path: packages/

      - name: Run Component Tests
        uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
        with:
          install: false
          command: pnpm run test:component:ci --spec ${{ matrix.container }}

      - name: Normalize test results artifact name
        continue-on-error: true
        if: failure()
        id: normalize-name
        shell: bash
        run: |
          packageName=$(echo ${{ matrix.container }} | sed 's/\//-/g')
          echo "artifactName=component-test-failures-${packageName}" >> $GITHUB_OUTPUT

      - name: Upload Component Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        if: failure()
        with:
          name: ${{ steps.normalize-name.outputs.artifactName }}
          path: |
            cypress/videos/
            cypress/screenshots/


  finish-test-and-publish:
    name: Collect Test Results And Publish
    needs: [build, component-tests]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read
    if: ${{ always() && needs.build.outputs.filter != '' }}

    steps:
      - name: Successful tests
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing tests
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: Generate Kong token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: ${{ github.event_name == 'push' }}
        id: app-token-kong
        with:
          client-id: ${{ vars.CORE_UI_GH_APP_READ_ID }}
          private-key: ${{ secrets.CORE_UI_GH_APP_READ_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write

      - name: Checkout Source Code
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token-kong.outputs.token }}

      - name: Setup PNPM with Dependencies
        if: ${{ github.event_name == 'push' }}
        uses: ./.github/actions/setup-pnpm-with-dependencies/

      - name: Download build artifacts
        if: ${{ github.event_name == 'push' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist-artifacts
          path: packages/

      # for lerna version we use:
      # --force-git-tag - if tag was already created it will be recreated instead of command failing and entire CI failing
      # --yes - so CI doesn't wait for the confirmation keyboard import
      # --create-release - so that release is created in github when version is changed
      # --conventional-commits - so that package's version changed following semantic releases
      #
      # we shall ignore lerna version error as pnpm publish will fail or not publish in case of such error
      - name: Publish packages to NPM
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.email "konnectx-engineers+kongponents-bot@konghq.com"
          git config user.name "Kong UI Bot"

          versions=$(pnpm --silent lerna version --conventional-commits --create-release github --yes --force-git-tag --json 2>lerna_error.txt || true)
          if [[ $(cat lerna_error.txt|grep "ERR!") ]]; then
            echo "Error executing lerna command:"
            cat lerna_error.txt
            exit -1
          fi

          if [[ "${versions}" == "" ]]; then
            echo "no packages to version"
            exit 0
          fi

          filterStr=$(echo ${versions} | jq -r 'try .[]|"--filter "+.name' | tr '\n' ' ')

          if [[ "${filterStr}" != "" ]]; then
            pnpmPublish=$(pnpm $filterStr publish  --no-git-checks --access public --report-summary)
          fi

          if [[ ! -z $(echo "${pnpmPublish}"|grep "There are no new packages that should be published") ]]; then
            echo "There are no new packages that should be published"
            exit 0
          fi
        env:
          GH_TOKEN: ${{ steps.app-token-kong.outputs.token }}

  notify-slack:
    name: Slack Notification
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - finish-test-and-publish
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get aggregate Workflow status
        uses: Kong/workflow-conclusion-action@e9d844ce2869399e71dbcb43d2c6192ddbdb3904 # v3.0.3 node24

      - name: Post Slack notification
        uses: Kong/public-shared-actions/slack-actions/workflow-notification@8d98bc15a5143332a36f206e6699296e6cc2adac
        with:
          slack-webhook-url: ${{ env.WORKFLOW_CONCLUSION == 'failure' && secrets.SLACK_WEBHOOK_URL_ALERT || secrets.SLACK_WEBHOOK_URL_NOTIFY }}
          status: ${{ env.WORKFLOW_CONCLUSION == 'failure' && 'failure' || 'success' }}
